<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Barbearia</title>
</head>
<body>
    <main>
        <h1>Criar conta</h1>
        <form action="">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" autocomplete="name" maxlength="100" required>

            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" autocomplete="email" maxlength="100" required>

            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" autocomplete="new-password" required>

            <button type="submit" disabled>Cadastrar</button>
        </form>

        <p><a href="index.html">Voltar ao login</a></p>
    </main>
    <script type="module" src="js/login.js"></script>
</body>
</html>
