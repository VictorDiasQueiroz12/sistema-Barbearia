<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Barbearia</title>
</head>
<body>
    <main>
        <h1>Fazer login na Barbearia</h1>

        <form action="">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" autocomplete="username" required>
            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" autocomplete="current-password" required>
            <button type="submit" disabled>Entrar</button>
        </form>
        <p><a href="cadastro.html">Criar conta</a></p>
    </main>
</body>
</html>
